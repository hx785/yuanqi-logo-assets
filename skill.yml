name: yuanqi-logo-assets
version: 1.1.0
displayName: 元企科技与机器人学校官方 Logo 资产库
author: YuanQi Tech
description: >-
  元企科技 (YuanQi Tech) 及旗下 yuanqee 机器人学校官方 Logo 资产库与场景调用指南。支持按品牌（元企科技/机器人学校）、场景（官网/暗黑模式/合同/头像/Favicon/展会横幅）与格式（PNG/SVG/PDF/ICO）智能推荐与定位最优 Logo 资产。

category: Design & Branding
tags:
  - branding
  - logo
  - design-system
  - yuanqi-tech
  - yuanqee-school
  - assets

inputs:
  - name: brand
    type: string
    required: false
    default: tech
    description: 品牌主体（tech: 元企科技, school: yuanqee 机器人学校）
  - name: scenario
    type: string
    required: false
    default: default
    description: 目标使用场景（如：default、dark_mode、print_black、avatar、favicon、banner、app_icon）
  - name: format
    type: string
    required: false
    default: png
    description: 期望格式（png, svg, pdf, ico）
  - name: size
    type: string
    required: false
    description: 指定像素或物理尺寸（如：512, 4000, 1080, 180）

entryPoint:
  instructionFile: SKILL.md
  helperScript: scripts/get_logo.js

compatibility:
  workbuddy: ">=1.0.0"
  claude-code: ">=1.0.0"
  codex: "all"
  antigravity: "all"
  cursor: "all"
